name: Test motore (GDScript headless)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine-tests:
    name: Test del motore di gioco
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scarica Godot 4.6.3 (headless)
        run: |
          set -eux
          URL="https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip"
          wget -q "$URL" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64
          echo "GODOT=$PWD/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Importa risorse (genera la cache delle classi)
        run: |
          set -eux
          # Prima apertura: Godot scansiona gli script e registra le classi
          # globali (class_name). Tollerante: alcune versioni terminano con
          # codice non-zero anche dopo un import riuscito.
          "$GODOT" --headless --path godot --import || true

      - name: Controllo dei glifi (niente quadratini)
        run: |
          set -eux
          pip install --quiet fonttools
          python3 tools/controlla_glifi.py

      - name: Partite automatiche IA contro IA (motore a decisioni)
        run: |
          set -euxo pipefail
          # Sei scenari con orientamenti e nazioni diverse: ogni partita deve
          # arrivare in fondo senza errori di script né blocchi.
          "$GODOT" --headless --path godot res://tests/SelfPlay.tscn -- 1,2,7,12,15,23 1 2>&1 | tee selfplay_output.txt
          if grep -q "SCRIPT ERROR" selfplay_output.txt; then
            echo "::error::Errori di script durante le partite automatiche"
            exit 1
          fi
          grep -q "SELFPLAY_RESULT: PASS" selfplay_output.txt
